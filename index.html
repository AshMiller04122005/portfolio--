<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Привет, мир!</h1>
    <!-- Контейнер для уведомлений (чтобы они шли друг под другом) -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Шаблон тоста (скрыт по умолчанию, JS будет его клонировать) -->
    <template id="toastTemplate">
        <div class="toast">
            <div class="toast-icon">✅</div>
            <div class="toast-message">Changes applied successfully!</div>
            <button class="toast-undo">Undo</button>
            <button class="toast-close">✕</button>
        </div>
    </template>
    <script src="scriot.js"></script>
</body>
</html>
